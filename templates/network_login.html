<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Training — Check-in PIN</title>
  <link rel="icon" href="/static/icons/sports/badminton.svg">
  <link href="/static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .pin-header { background: #1a3a5c; color: #fff; }
  </style>
</head>
<body>

<div class="pin-header py-3 px-4 d-flex align-items-center gap-2 mb-5">
  <img src="/static/icons/sports/badminton.svg" alt="" width="26" height="26"
       style="filter:brightness(0) invert(1)">
  <span class="fw-bold fs-5">Club Training</span>
</div>

<div class="container" style="max-width:380px">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4 text-center">
      <h5 class="fw-bold mb-2">Check-in PIN</h5>
      <p class="text-muted small mb-3">
        This computer is connecting to the club's Club Training.
        Enter the PIN from the club admin.
      </p>
      <form method="post">
        <input type="hidden" name="next" value="{{ next }}">
        <input type="password" name="pin" class="form-control form-control-lg text-center mb-3"
               inputmode="numeric" pattern="\d{4,8}" maxlength="8" autofocus
               autocomplete="off" placeholder="••••">
        {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
        <button class="btn btn-primary w-100 fw-semibold">Open Club Training</button>
      </form>
    </div>
  </div>
</div>

</body>
</html>
