{% extends 'base.html' %}
{% block title %}Settings — {{ club_name }}{% endblock %}
{% block content %}

<h5 class="mb-3 fw-bold">Club Settings</h5>

<div class="card shadow-sm border-0" style="max-width:480px">
  <div class="card-header fw-semibold">General</div>
  <div class="card-body">
    <form method="post" action="/settings">
      <div class="mb-3">
        <label class="form-label fw-semibold">Club name</label>
        <input type="text" name="club_name" class="form-control"
               value="{{ club_name }}" placeholder="My Badminton Club">
        <div class="form-text">Shown in the page title and navbar.</div>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>
</div>

<div class="card shadow-sm border-0 mt-4" style="max-width:480px">
  <div class="card-header fw-semibold">Export Data</div>
  <div class="card-body">
    <p class="text-muted small mb-2">Download an Excel spreadsheet with attendance, payment, and coach data.</p>
    <form method="get" action="/export/excel" class="d-flex gap-2 align-items-end">
      <div>
        <label class="form-label small fw-semibold mb-1">Month</label>
        <input type="month" name="month" class="form-control form-control-sm"
               value="{{ today.strftime('%Y-%m') }}">
      </div>
      <button type="submit" class="btn btn-outline-secondary btn-sm">↓ Download Excel</button>
    </form>
  </div>
</div>

{% endblock %}
